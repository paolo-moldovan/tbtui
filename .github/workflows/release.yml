# Release: push a tag like v0.2.0 (see RELEASING.md). This builds binaries for
# Linux and macOS, attaches them to a GitHub release (used by `cargo binstall`),
# then publishes the crate to crates.io.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml and CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "$version" = "$crate" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $crate"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
  build:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # pure Rust, so the Intel binary is cross-compiled on the arm64 runner
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar czf tbtui-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release tbtui
      - uses: softprops/action-gh-release@v2
        with:
          files: "tbtui-${{ matrix.target }}.tar.gz"
          generate_release_notes: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Needs the repository secret CARGO_REGISTRY_TOKEN (crates.io → Account Settings → API Tokens).
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
