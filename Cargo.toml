[package]
name = "tbtui"
version = "0.1.1"
edition = "2024"
authors = ["Paolo Moldovan", "Claude <noreply@anthropic.com>"]
rust-version = "1.88"
description = "TensorBoard scalars in your terminal: live, interactive loss curves, local or over ssh"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paolo-moldovan/tbtui"
keywords = ["tensorboard", "tui", "machine-learning", "plot", "terminal"]
categories = ["command-line-utilities", "visualization"]
# Ship only what a build needs (keeps editor/tool folders out of the crate).
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-*"]

# `cargo binstall tbtui` downloads the prebuilt binaries that
# .github/workflows/release.yml attaches to each GitHub release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
grex = { version = "1.4.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
