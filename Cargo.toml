[package]
name = "tbtui"
version = "0.1.0"
edition = "2024"
description = "TensorBoard scalars in your terminal: live, interactive loss curves"
license = "MIT"
keywords = ["tensorboard", "tui", "machine-learning", "plot", "terminal"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
grex = { version = "1.4.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
